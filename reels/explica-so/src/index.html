<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UaiPertim — Explica, Sô!</title>
<style>
  /* Poppins da marca (public/fonts do repositório): Medium 500, ExtraBold 800, Black 900 */
  @font-face { font-family: 'UP Poppins'; src: url('../../../public/fonts/poppins-latin-500-normal.woff2') format('woff2'); font-weight: 500; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'UP Poppins'; src: url('../../../public/fonts/poppins-latin-ext-500-normal.woff2') format('woff2'); font-weight: 500; unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'UP Poppins'; src: url('../../../public/fonts/poppins-latin-800-normal.woff2') format('woff2'); font-weight: 800; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'UP Poppins'; src: url('../../../public/fonts/poppins-latin-ext-800-normal.woff2') format('woff2'); font-weight: 800; unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'UP Poppins'; src: url('../../../public/fonts/poppins-latin-900-normal.woff2') format('woff2'); font-weight: 900; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'UP Poppins'; src: url('../../../public/fonts/poppins-latin-ext-900-normal.woff2') format('woff2'); font-weight: 900; unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  html, body { margin: 0; background: #F6EEE2; color: #221C19; font-family: 'UP Poppins', sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; box-sizing: border-box; min-height: 100vh; }
  canvas { height: calc(100vh - 110px); aspect-ratio: 9 / 16; max-width: 100%; border-radius: 14px; box-shadow: 0 20px 60px rgba(120,60,30,.25); background: #F6EEE2; }
  .ui { display: flex; gap: 12px; align-items: center; width: min(560px, 100%); }
  button { font: 800 14px 'UP Poppins', sans-serif; letter-spacing: 1px; background: #F2502B; color: #fff; border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; }
  input[type=range] { flex: 1; accent-color: #F2502B; }
  .time { font-variant-numeric: tabular-nums; width: 64px; text-align: right; }
  body.render { padding: 0; display: block; }
  body.render canvas { height: auto; width: 1080px; border-radius: 0; box-shadow: none; }
  body.render .ui { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="ui">
  <button id="play">▶ PLAY</button>
  <input id="seek" type="range" min="0" max="14" step="0.01" value="0">
  <span class="time" id="time">0.00s</span>
</div>
<audio id="audio" preload="auto"></audio>
<script src="anim.js"></script>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const params = new URLSearchParams(location.search);
  const EPID = params.get('ep') || 'explica-so-01';            // o episódio: episodios/<id>.json (a linha do tempo: audio/<id>/linha.json)
  const LINHA = params.has('previa') ? `../audio/${EPID}/previa/linha.json` : `../audio/${EPID}/linha.json`;   // ?previa = tempos estimados, sem voz
  const loadImg = (src) => new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = src; });
  window.ready = (async () => {
    const fonts = [500, 800, 900].map(w => document.fonts.load(`${w} 100px 'UP Poppins'`, 'Aa Ãç…'))
      .concat(document.fonts.load("100px 'Noto Color Emoji'", '😅'));
    const [img, ep] = await Promise.all([loadImg('../../../public/img/uaipertim_logo.png'),   // a logo oficial (o arquivo, nunca redesenhada)
      fetch(LINHA).then((r) => r.json()), ...fonts]);
    await img.decode();
    await document.fonts.ready;
    EXPLICA.init(img, ep); // layout tipográfico + linha do tempo + cues (precisa das fontes carregadas)
    document.title = `UaiPertim — Explica, Sô! ${EPID}`;
  })();

  if (params.has('render')) {
    document.body.classList.add('render');
    // usados por scripts/render.cjs
    window.frameAt = (t, o) => { EXPLICA.renderAt(ctx, t, o); return canvas.toDataURL('image/png'); };
    window.cues = () => EXPLICA.cues();
    window.caixas = (t) => EXPLICA.caixas(ctx, t);
  } else {
    const audio = document.getElementById('audio');
    if (!params.has('previa')) audio.src = `../audio/${EPID}/mix.wav`;
    const seek = document.getElementById('seek'), timeEl = document.getElementById('time'), btn = document.getElementById('play');
    let playing = false, t0 = 0, base = 0;
    const draw = (t) => { EXPLICA.renderAt(ctx, t); seek.value = t; timeEl.textContent = t.toFixed(2) + 's'; };
    const loop = (now) => {
      if (!playing) return;
      let t = audio.readyState >= 2 && !audio.paused ? audio.currentTime : base + (now - t0) / 1000;
      if (t >= EXPLICA.DURATION) { t = 0; base = 0; t0 = now; audio.currentTime = 0; }
      draw(t); requestAnimationFrame(loop);
    };
    btn.onclick = () => {
      playing = !playing; btn.textContent = playing ? '❚❚ PAUSA' : '▶ PLAY';
      if (playing) { base = +seek.value; t0 = performance.now(); audio.currentTime = base; audio.play().catch(() => {}); requestAnimationFrame(loop); }
      else audio.pause();
    };
    seek.oninput = () => { base = +seek.value; t0 = performance.now(); audio.currentTime = base; draw(base); };
    window.ready.then(() => { seek.max = (EXPLICA.DURATION - 0.01).toFixed(2); draw(+(params.get('t') || 0)); });
  }
</script>
</body>
</html>
