<script type="text/x-dc" data-dc-script data-props='{"v":{"editor":"enum","options":["1","3"],"default":"1"},"view":{"editor":"enum","options":["frente","tq"],"default":"frente"},"expr":{"editor":"enum","options":["neutro","sorrindo","alegre","curioso","surpreso","pensativo","apressado","piscadinha"],"default":"neutro"},"mouth":{"editor":"enum","options":["auto","repouso","A","E","O","MBP"],"default":"auto"},"pose":{"editor":"enum","options":["parado","acenando","apontando","sacola","comemorando","correndo","moto"],"default":"parado"},"crop":{"editor":"enum","options":["corpo","rosto"],"default":"corpo"},"layer":{"editor":"enum","options":["todas","mochila","pernas","corpo","capacete","viseira","olhos","boca","bracos"],"default":"todas"},"h":{"editor":"int","min":24,"max":1200,"default":300},"$preview":{"width":267,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const v = Math.min(3, Math.max(1, Number(p.v ?? 1) || 1));
    const v1 = v === 1;
    const pose = v1 ? (p.pose ?? 'parado') : 'parado';
    const moto = pose === 'moto';
    const expr = p.expr ?? 'neutro';
    const crop = p.crop ?? 'corpo';
    const layer = p.layer ?? 'todas';
    const H = Number(p.h ?? 300) || 300;
    const tq = (p.view ?? 'frente') === 'tq' || pose === 'correndo' || moto;
    const S = (b) => (b ? 'inline' : 'none');
    const all = layer === 'todas';
    const L = (k) => all || layer === k;
    const body = crop !== 'rosto';

    let vb = [0, 18, 240, 270];
    if (!body) vb = v === 1 ? [28, 36, 184, 184] : v === 2 ? [46, 26, 148, 148] : [41, 42, 158, 158];
    else if (moto) vb = [-24, 40, 300, 254];
    else if (pose !== 'parado') vb = [-20, 6, 280, 284];
    const W = Math.round(H * vb[2] / vb[3]);

    const base = moto ? 'translate(110 108) scale(0.8) translate(-120 -120)'
      : v === 2 ? 'translate(120 96) scale(0.8) translate(-120 -120)'
      : v === 3 ? 'translate(120 116) scale(0.86) translate(-120 -120)' : '';
    let tilt = '';
    if (pose === 'correndo') tilt = 'rotate(8 120 240)';
    else if (!moto && expr === 'curioso') tilt = 'rotate(-7 120 220)';
    else if (!moto && expr === 'apressado') tilt = 'rotate(5 120 230)';
    const pinT = (base + ' ' + tilt).trim();
    const charT = pose === 'comemorando' ? 'translate(0 -14)' : '';

    const LF = { lid: 'inline', lidD: 'M-20,-22 H20 V-3 H-20 Z', lineD: 'M-14.8,-3 H14.8' };
    const LAL = { lid: 'inline', lidD: 'M-20,-22 H20 V-1 L-20,-13 Z', lineD: 'M-12,-10.6 L14.6,-2.6' };
    const LAR = { lid: 'inline', lidD: 'M-20,-22 H20 V-13 L-20,-1 Z', lineD: 'M-14.6,-2.6 L12,-10.6' };
    const E = (o) => Object.assign({ open: 'inline', lid: 'none', happy: 'none', wink: 'none', px: 2, py: 2, s: 1, lidD: 'M0,0', lineD: 'M0,0' }, o || {});
    const X = {
      neutro: [E(), E(), 'repouso', 0.32],
      sorrindo: [E({ px: 2, py: 1 }), E({ px: 2, py: 1 }), 'sorriso', 0.45],
      alegre: [E({ open: 'none', happy: 'inline' }), E({ open: 'none', happy: 'inline' }), 'sorriso', 0.5],
      curioso: [E({ px: 4, py: -2, s: 1.1 }), E(Object.assign({ px: 4, py: -1 }, LF)), 'curioso', 0.32],
      surpreso: [E({ px: 0, py: 0, s: 1.16 }), E({ px: 0, py: 0, s: 1.16 }), 'O', 0.28],
      pensativo: [E({ px: -4, py: -6 }), E({ px: -4, py: -6 }), 'hmm', 0.28],
      apressado: [E(Object.assign({ px: 5, py: 1 }, LAL)), E(Object.assign({ px: 5, py: 1 }, LAR)), 'grit', 0.4],
      piscadinha: [E({ px: 2, py: 1 }), E({ open: 'none', wink: 'inline' }), 'smirk', 0.42],
    };
    const x = X[expr] || X.neutro;
    const fin = (e, cx, sx) => Object.assign({}, e, {
      t: 'translate(' + cx + ' 152) scale(' + (e.s * sx) + ' ' + e.s + ')',
      g1x: e.px + 3.5, g1y: e.py - 4.2, g2x: e.px - 3, g2y: e.py + 4.5,
    });
    const eL = fin(x[0], 98, 1);
    const eR = fin(x[1], 142, tq ? 0.84 : 1);

    const m = {};
    ['repouso', 'sorriso', 'A', 'E', 'O', 'MBP', 'curioso', 'hmm', 'grit', 'smirk'].forEach((k) => { m[k] = S(mk === k); });

    const d = {
      sombra: S(all && body),
      pack: S(L('mochila') && (tq || layer === 'mochila')),
      alcas: S(L('mochila')),
      alcaR: S(!tq || layer === 'mochila'),
      corpo: S(L('corpo')),
      capacete: S(L('capacete')),
      viseira: S(L('viseira')),
      olhos: S(L('olhos')),
      boca: S(L('boca')),
      bracos: S(L('bracos') && body && !moto),
      pernas: S(L('pernas') && body),
      moto: S(all && moto && body),
    };
    const a = {
      l1: S(v1 && ['parado', 'acenando', 'apontando'].indexOf(pose) > -1),
      lBag: S(v1 && pose === 'sacola'),
      lUp: S(v1 && pose === 'comemorando'),
      lBack: S(v1 && pose === 'correndo'),
      r1: S(v1 && ['parado', 'sacola'].indexOf(pose) > -1),
      rWave: S(v1 && pose === 'acenando'),
      rPoint: S(v1 && pose === 'apontando'),
      rUp: S(v1 && pose === 'comemorando'),
      rFwd: S(v1 && pose === 'correndo'),

      v3: S(v === 3),
    };
    const g = {
      v1: S(v1 && pose !== 'correndo' && !moto),
      run: S(v1 && pose === 'correndo'),
      v2: S(v === 2),
    };
    const fx = {
      local: S(all),
      dots: S(expr === 'pensativo'),
      sweat: S(expr === 'apressado'),
      spark: S(expr === 'piscadinha'),
      world: S(all && body),
      speed: S(expr === 'apressado' && !moto && pose !== 'correndo'),
      runfx: S(pose === 'correndo'),
      confetti: S(pose === 'comemorando'),
    };

    let sh = { cx: 120, cy: 276, rx: 50, ry: 7 };
    if (v === 2) sh = { cx: 120, cy: 272, rx: 54, ry: 7 };
    if (v === 3) sh = { cx: 120, cy: 276, rx: 32, ry: 5 };
    if (pose === 'comemorando') sh = { cx: 120, cy: 276, rx: 36, ry: 5 };
    if (pose === 'correndo') sh = { cx: 122, cy: 273, rx: 60, ry: 7 };
    if (moto) sh = { cx: 150, cy: 284, rx: 130, ry: 7 };

    return {
      vb: vb.join(' '), W, H, label: 'UaiPertim, versão ' + v,
      pinT, charT, eL, eR, m, d, a, g, fx, sh, cheek: x[3],
      faceT: tq ? 'translate(15 1)' : '',
      brimT: tq ? 'translate(7 0)' : '',
      visorT: tq ? 'translate(6 0)' : '',
      strapT: tq ? 'translate(6 0)' : '',
    };
  }
